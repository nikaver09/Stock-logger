<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockLogger · Sign In</title>
  <meta name="description" content="Sign in to StockLogger — warehouse inventory management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Loading Screen Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-card">
      <div class="loading-logo">
        <div class="loading-logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#08160e" stroke-width="2" fill="none"/>
            <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#08160e" stroke-width="1.4" opacity=".7"/>
          </svg>
        </div>
        <span class="loading-logo-name">StockLogger</span>
      </div>
    </div>
  </div>

  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
          <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#08160e" stroke-width="2" fill="none"/>
          <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#08160e" stroke-width="1.4" opacity=".7"/>
        </svg>
      </div>
      <span class="logo-name">StockLogger</span>
    </div>

    <!-- Role Switch Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabAdmin" role="tab" aria-selected="true">Admin</button>
      <button class="tab" id="tabEmployee" role="tab" aria-selected="false">Employee</button>
    </div>

    <!-- Login Form -->
    <div id="loginPane">
      <div class="form-title" id="formTitle">Admin Login</div>

      <form class="fields" id="loginForm" autocomplete="off" novalidate>
        <div class="field">
          <label for="loginUsername">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="loginUsername" placeholder="Enter username" required autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="eye-btn" id="loginEye" aria-label="Show password">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        
        <div class="auth-msg" id="loginMsg" role="status"></div>

        <button type="submit" class="btn-submit" id="loginBtn">
          <span id="loginBtnText">Log in</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>

    <p class="footer-note">Warehouse data stored locally in your browser.</p>
  </div>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
