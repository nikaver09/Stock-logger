<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockLogger · Sign In</title>
  <meta name="description" content="Sign in to StockLogger — warehouse inventory management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-card">
      <div class="loading-logo">
        <div class="loading-logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#08160e" stroke-width="2" fill="none"/>
            <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#08160e" stroke-width="1.4" opacity=".7"/>
          </svg>
        </div>
        <span class="loading-logo-name">StockLogger</span>
      </div>
      <div class="spinner"></div>
      <div class="loading-text">Authenticating...</div>
    </div>
  </div>

  <div class="page-wrap">

    <!-- Tab switcher -->
    <div class="tab-bar" role="tablist">
      <button id="tabCashier" class="tab-btn active" role="tab" aria-selected="true"  aria-controls="panelCashier">Cashier</button>
      <button id="tabAdmin"   class="tab-btn"        role="tab" aria-selected="false" aria-controls="panelAdmin">Admin</button>
    </div>

    <!-- Card -->
    <div class="login-card">

      <!-- ── Cashier Panel ── -->
      <div id="panelCashier" class="login-panel active" role="tabpanel" aria-labelledby="tabCashier">
        <div class="card-header">
          <h1 class="card-title">Cashier Login</h1>
          <p class="card-sub">StockLogger</p>
        </div>

        <form class="fields" id="employeeForm" autocomplete="off" novalidate>
          <div class="field">
            <label for="empUsername">Username</label>
            <input type="text" id="empUsername" placeholder="" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="empPassword">Password</label>
            <input type="password" id="empPassword" placeholder="" required autocomplete="current-password" />
          </div>

          <div class="auth-msg" id="empMsg" role="status"></div>

          <button type="submit" class="btn-submit" id="empBtn">
            <span id="empBtnText">Log in</span>
          </button>
        </form>
      </div>

      <!-- ── Admin Panel ── -->
      <div id="panelAdmin" class="login-panel" role="tabpanel" aria-labelledby="tabAdmin">
        <div class="card-header">
          <h1 class="card-title">Admin Login</h1>
          <p class="card-sub">StockLogger</p>
        </div>

        <form class="fields" id="adminForm" autocomplete="off" novalidate>
          <div class="field">
            <label for="adminUsername">Username</label>
            <input type="text" id="adminUsername" placeholder="" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="" required autocomplete="current-password" />
          </div>

          <div class="auth-msg" id="adminMsg" role="status"></div>

          <button type="submit" class="btn-submit" id="adminBtn">
            <span id="adminBtnText">Log in</span>
          </button>
        </form>
      </div>

    </div><!-- /login-card -->
  </div><!-- /page-wrap -->

  <script>
    /* ── Tab switching ── */
    const tabs = {
      cashier: { btn: document.getElementById('tabCashier'), panel: document.getElementById('panelCashier') },
      admin:   { btn: document.getElementById('tabAdmin'),   panel: document.getElementById('panelAdmin') },
    };

    function switchTab(active) {
      Object.entries(tabs).forEach(([key, { btn, panel }]) => {
        const isActive = key === active;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', String(isActive));
        panel.classList.toggle('active', isActive);
      });
    }

    tabs.cashier.btn.addEventListener('click', () => switchTab('cashier'));
    tabs.admin.btn.addEventListener('click',   () => switchTab('admin'));
  </script>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
