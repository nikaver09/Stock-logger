<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockLogger · Sign In</title>
  <meta name="description" content="Sign in to StockLogger — warehouse inventory management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center min-h-screen font-sans antialiased text-white selection:bg-blue-500/30">

  <!-- 3D Background Canvas -->
  <canvas id="bg-canvas" class="fixed inset-0 z-[-1]"></canvas>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-[#0a0a0a]/90 backdrop-blur-sm z-50 flex items-center justify-center hidden transition-opacity duration-300">
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 rounded-full border border-zinc-800 flex items-center justify-center mb-4 bg-zinc-900">
        <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
          <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#3b82f6" stroke-width="2" fill="none"/>
          <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#3b82f6" stroke-width="1.4" opacity=".7"/>
        </svg>
      </div>
      <div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
      <div class="text-sm text-zinc-400 loading-text">Authenticating...</div>
    </div>
  </div>

  <div class="w-full max-w-[400px] px-5">
    <!-- Card -->
    <div class="bg-[#121212] border border-white/5 rounded-2xl p-8 sm:p-10 relative overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
      
      <!-- Top glow effect -->
      <div class="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
      <div class="absolute -top-10 inset-x-0 h-20 bg-blue-500/10 blur-3xl rounded-full pointer-events-none"></div>

      <!-- Logo -->
      <div class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center mx-auto mb-6 bg-[#18181b] shadow-inner">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#e4e4e7" stroke-width="2" fill="none"/>
          <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#e4e4e7" stroke-width="1.4" opacity=".7"/>
        </svg>
      </div>

      <h1 class="text-[22px] font-semibold text-center mb-1 tracking-tight">Welcome Back</h1>
      <p class="text-sm text-zinc-400 text-center mb-6">StockLogger Authentication</p>

      <!-- Tab switcher -->
      <div class="flex bg-[#18181b] rounded-lg p-1 mb-6" role="tablist">
        <button id="tabCashier" class="flex-1 text-sm font-medium py-2 rounded-md transition-all text-white bg-[#27272a] shadow-sm" role="tab" aria-selected="true" aria-controls="panelCashier">Cashier</button>
        <button id="tabAdmin" class="flex-1 text-sm font-medium py-2 rounded-md transition-all text-zinc-500 hover:text-white" role="tab" aria-selected="false" aria-controls="panelAdmin">Admin</button>
      </div>

      <!-- ── Cashier Panel ── -->
      <div id="panelCashier" class="block" role="tabpanel" aria-labelledby="tabCashier">
        <form id="employeeForm" autocomplete="off" novalidate>
          <div class="space-y-3">
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              </div>
              <input type="text" id="empUsername" class="w-full bg-[#18181b] text-white text-sm rounded-lg focus:ring-1 focus:ring-blue-500 block pl-10 p-3.5 outline-none transition-all placeholder-zinc-500" placeholder="Username" required autocomplete="username" />
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              </div>
              <input type="password" id="empPassword" class="w-full bg-[#18181b] text-white text-sm rounded-lg focus:ring-1 focus:ring-blue-500 block pl-10 p-3.5 outline-none transition-all placeholder-zinc-500" placeholder="Password" required autocomplete="current-password" />
            </div>
          </div>

          <div class="text-sm text-red-400 mt-3 hidden" id="empMsg" role="status"></div>

          <button type="submit" id="empBtn" class="w-full text-white bg-blue-600 hover:bg-blue-500 font-medium rounded-lg text-sm px-5 py-3.5 text-center transition-all mt-6 shadow-lg shadow-blue-500/20">
            <span id="empBtnText">Login</span>
          </button>
          
          <div class="mt-5 text-center">
            <button type="button" class="text-[13px] text-zinc-500 hover:text-zinc-300 transition-colors" id="forgotCashier">Forgot password?</button>
          </div>
        </form>
      </div>

      <!-- ── Admin Panel ── -->
      <div id="panelAdmin" class="hidden" role="tabpanel" aria-labelledby="tabAdmin">
        <form id="adminForm" autocomplete="off" novalidate>
          <div class="space-y-3">
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              </div>
              <input type="text" id="adminUsername" class="w-full bg-[#18181b] text-white text-sm rounded-lg focus:ring-1 focus:ring-blue-500 block pl-10 p-3.5 outline-none transition-all placeholder-zinc-500" placeholder="Admin Username" required autocomplete="username" />
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <svg class="w-4 h-4 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              </div>
              <input type="password" id="adminPassword" class="w-full bg-[#18181b] text-white text-sm rounded-lg focus:ring-1 focus:ring-blue-500 block pl-10 p-3.5 outline-none transition-all placeholder-zinc-500" placeholder="Password" required autocomplete="current-password" />
            </div>
          </div>

          <div class="text-sm text-red-400 mt-3 hidden" id="adminMsg" role="status"></div>

          <button type="submit" id="adminBtn" class="w-full text-white bg-blue-600 hover:bg-blue-500 font-medium rounded-lg text-sm px-5 py-3.5 text-center transition-all mt-6 shadow-lg shadow-blue-500/20">
            <span id="adminBtnText">Login</span>
          </button>
          
          <div class="mt-5 text-center">
            <button type="button" class="text-[13px] text-zinc-500 hover:text-zinc-300 transition-colors" id="forgotAdmin">Forgot password?</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <!-- ── Reset Password Modal ── -->
  <div id="resetModal" class="fixed inset-0 bg-[#0a0a0a]/80 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <div class="bg-[#111111] border border-white/10 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl relative">
      <button class="absolute top-4 right-4 text-zinc-500 hover:text-white transition-colors" id="closeResetModal" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      
      <div class="w-10 h-10 rounded-full bg-zinc-800/50 border border-white/5 flex items-center justify-center mb-4 text-zinc-300">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      
      <h2 id="resetModalTitle" class="text-lg font-semibold mb-2">Reset Password</h2>
      <p class="text-sm text-zinc-400 mb-6">Your password will be reset to the <strong>default</strong>. Enter your username to confirm.</p>

      <!-- Step 1: enter username -->
      <div id="resetStep1">
        <div class="mb-4">
          <input type="text" id="resetUsername" class="w-full bg-[#0a0a0a] border border-white/5 text-white text-sm rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 block p-3 outline-none transition-all placeholder-zinc-600" placeholder="Enter your username" autocomplete="off" />
        </div>
        <p id="resetMsg" class="text-sm text-red-400 mb-4 hidden" role="status"></p>
        <div class="flex gap-3">
          <button type="button" id="cancelResetModal" class="flex-1 py-2.5 px-4 bg-[#1a1a1a] hover:bg-zinc-800 text-sm font-medium rounded-lg transition-colors border border-white/5 text-zinc-300">Cancel</button>
          <button type="button" id="confirmReset" class="flex-1 py-2.5 px-4 bg-white text-black hover:bg-zinc-200 text-sm font-medium rounded-lg transition-colors">Reset</button>
        </div>
      </div>

      <!-- Step 2: success -->
      <div id="resetStep2" class="hidden">
        <div class="w-10 h-10 rounded-full bg-green-500/10 text-green-500 flex items-center justify-center mb-4">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="text-white font-medium mb-1">Password reset successfully!</p>
        <p id="resetSuccessInfo" class="text-sm text-zinc-400 mb-6"></p>
        <button type="button" id="closeResetSuccess" class="w-full py-2.5 px-4 bg-white text-black hover:bg-zinc-200 text-sm font-medium rounded-lg transition-colors">Got it</button>
      </div>
    </div>
  </div>

  <script>
    /* ── Tab switching ── */
    const tabs = {
      cashier: { btn: document.getElementById('tabCashier'), panel: document.getElementById('panelCashier') },
      admin:   { btn: document.getElementById('tabAdmin'),   panel: document.getElementById('panelAdmin') },
    };

    function switchTab(active) {
      Object.entries(tabs).forEach(([key, { btn, panel }]) => {
        const isActive = key === active;
        
        if (isActive) {
          btn.className = "flex-1 text-sm font-medium py-2 rounded-md transition-all text-white bg-[#1a1a1a] shadow-sm border border-white/5";
          panel.classList.remove('hidden');
          panel.classList.add('block');
        } else {
          btn.className = "flex-1 text-sm font-medium py-2 rounded-md transition-all text-zinc-500 hover:text-white border border-transparent";
          panel.classList.add('hidden');
          panel.classList.remove('block');
        }
        btn.setAttribute('aria-selected', String(isActive));
      });
    }

    tabs.cashier.btn.addEventListener('click', () => switchTab('cashier'));
    tabs.admin.btn.addEventListener('click',   () => switchTab('admin'));

    // Observe modal open class since we removed custom CSS class logic in favor of Tailwind classes
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.attributeName === 'class') {
          const resetOverlay = document.getElementById('resetModal');
          if (resetOverlay.classList.contains('open')) {
             resetOverlay.classList.remove('opacity-0', 'pointer-events-none');
          } else {
             resetOverlay.classList.add('opacity-0', 'pointer-events-none');
          }
        }
      });
    });
    observer.observe(document.getElementById('resetModal'), { attributes: true });

    // Override the display logic for errors to use Tailwind hidden class instead of textContent only
    const originalShowError = window.showError;
    const originalClearError = window.clearError;
    
    // We will let the login.ts run and manipulate classes slightly if needed
    // But login.ts might add/remove 'error' class which doesn't do anything now.
    // So we will patch the DOM so the hidden class is toggled.
    const patchMsg = (id) => {
      const el = document.getElementById(id);
      if(!el) return;
      const observer = new MutationObserver(() => {
        if(el.textContent.trim() !== '') {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
      observer.observe(el, { childList: true, characterData: true, subtree: true });
    };
    patchMsg('empMsg');
    patchMsg('adminMsg');
    patchMsg('resetMsg');

  </script>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
