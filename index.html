<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockLogger · Sign In</title>
  <meta name="description" content="Sign in to StockLogger — warehouse inventory management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-card">
      <div class="loading-logo">
        <div class="loading-logo-icon">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#08160e" stroke-width="2" fill="none"/>
            <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#08160e" stroke-width="1.4" opacity=".7"/>
          </svg>
        </div>
        <span class="loading-logo-name">StockLogger</span>
      </div>
      <div class="spinner"></div>
      <div class="loading-text">Authenticating...</div>
    </div>
  </div>

  <div class="page-wrap">

    <!-- Tab switcher -->
    <div class="tab-bar" role="tablist">
      <button id="tabCashier" class="tab-btn active" role="tab" aria-selected="true"  aria-controls="panelCashier">Cashier</button>
      <button id="tabAdmin"   class="tab-btn"        role="tab" aria-selected="false" aria-controls="panelAdmin">Admin</button>
    </div>

    <!-- Card -->
    <div class="login-card">

      <!-- ── Cashier Panel ── -->
      <div id="panelCashier" class="login-panel active" role="tabpanel" aria-labelledby="tabCashier">
        <div class="card-header">
          <h1 class="card-title">Cashier Login</h1>
          <p class="card-sub">StockLogger</p>
        </div>

        <form class="fields" id="employeeForm" autocomplete="off" novalidate>
          <div class="field">
            <label for="empUsername">Username</label>
            <input type="text" id="empUsername" placeholder="" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="empPassword">Password</label>
            <input type="password" id="empPassword" placeholder="" required autocomplete="current-password" />
          </div>

          <div class="auth-msg" id="empMsg" role="status"></div>

          <button type="submit" class="btn-submit" id="empBtn">
            <span id="empBtnText">Log in</span>
          </button>
          <div class="forgot-row">
            <button type="button" class="forgot-link" id="forgotCashier">Forgot password?</button>
          </div>
        </form>
      </div>

      <!-- ── Admin Panel ── -->
      <div id="panelAdmin" class="login-panel" role="tabpanel" aria-labelledby="tabAdmin">
        <div class="card-header">
          <h1 class="card-title">Admin Login</h1>
          <p class="card-sub">StockLogger</p>
        </div>

        <form class="fields" id="adminForm" autocomplete="off" novalidate>
          <div class="field">
            <label for="adminUsername">Username</label>
            <input type="text" id="adminUsername" placeholder="" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="" required autocomplete="current-password" />
          </div>

          <div class="auth-msg" id="adminMsg" role="status"></div>

          <button type="submit" class="btn-submit" id="adminBtn">
            <span id="adminBtnText">Log in</span>
          </button>
          <div class="forgot-row">
            <button type="button" class="forgot-link" id="forgotAdmin">Forgot password?</button>
          </div>
        </form>
      </div>

    </div><!-- /login-card -->
  </div><!-- /page-wrap -->

  <!-- ── Reset Password Modal ── -->
  <div id="resetModal" class="reset-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <div class="reset-modal">
      <button class="reset-modal-close" id="closeResetModal" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="reset-modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 id="resetModalTitle" class="reset-modal-title">Reset Password</h2>
      <p class="reset-modal-sub">Your password will be reset to the <strong>default</strong>. Enter your username to confirm.</p>

      <!-- Step 1: enter username -->
      <div id="resetStep1">
        <div class="reset-field">
          <label for="resetUsername">Username</label>
          <input type="text" id="resetUsername" placeholder="Enter your username" autocomplete="off" />
        </div>
        <p id="resetMsg" class="reset-msg" role="status"></p>
        <div class="reset-actions">
          <button type="button" id="cancelResetModal" class="btn-reset-cancel">Cancel</button>
          <button type="button" id="confirmReset" class="btn-reset-confirm">Reset Password</button>
        </div>
      </div>

      <!-- Step 2: success -->
      <div id="resetStep2" style="display:none;">
        <div class="reset-success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="reset-success-text">Password reset successfully!</p>
        <p id="resetSuccessInfo" class="reset-success-sub"></p>
        <button type="button" id="closeResetSuccess" class="btn-reset-confirm" style="width:100%; margin-top:20px;">Got it</button>
      </div>
    </div>
  </div>

  <script>
    /* ── Tab switching ── */
    const tabs = {
      cashier: { btn: document.getElementById('tabCashier'), panel: document.getElementById('panelCashier') },
      admin:   { btn: document.getElementById('tabAdmin'),   panel: document.getElementById('panelAdmin') },
    };

    function switchTab(active) {
      Object.entries(tabs).forEach(([key, { btn, panel }]) => {
        const isActive = key === active;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', String(isActive));
        panel.classList.toggle('active', isActive);
      });
    }

    tabs.cashier.btn.addEventListener('click', () => switchTab('cashier'));
    tabs.admin.btn.addEventListener('click',   () => switchTab('admin'));
  </script>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
