<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StockLogger · Sign In</title>
    <meta
      name="description"
      content="Sign in to StockLogger — warehouse inventory management."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="rack-backdrop" aria-hidden="true">
      <div id="login-rack" class="rack-stage">
        <svg class="rack-svg" viewBox="0 0 400 440"></svg>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="loading-inner">
        <div class="loading-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
            <path
              d="M7 20V12l7-4 7 4v8l-7 4-7-4Z"
              stroke="#1a1a1a"
              stroke-width="2"
              fill="none"
            />
            <path
              d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8"
              stroke="#1a1a1a"
              stroke-width="1.4"
              opacity=".5"
            />
          </svg>
        </div>
        <div class="loading-spinner"></div>
        <div class="loading-label loading-text">Authenticating...</div>
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-inner">
        <!-- Logo -->
        <div class="auth-logo">
          <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
            <path
              d="M7 20V12l7-4 7 4v8l-7 4-7-4Z"
              stroke="#f2f0ed"
              stroke-width="2"
              fill="none"
            />
            <path
              d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8"
              stroke="#f2f0ed"
              stroke-width="1.4"
              opacity=".6"
            />
          </svg>
        </div>

        <p class="auth-subtitle">StockLogger Authentication</p>

        <!-- Tab switcher -->
        <div class="tab-switcher" role="tablist">
          <button
            id="tabAdmin"
            class="tab-btn"
            role="tab"
            aria-selected="false"
            aria-controls="panelAdmin"
          >
            Admin
          </button>
          <button
            id="tabCashier"
            class="tab-btn active"
            role="tab"
            aria-selected="true"
            aria-controls="panelCashier"
          >
            Cashier
          </button>
        </div>

        <!-- ── Cashier Panel ── -->
        <div id="panelCashier" role="tabpanel" aria-labelledby="tabCashier">
          <form id="employeeForm" autocomplete="off" novalidate>
            <div class="form-group">
              <div class="input-wrap">
                <svg
                  class="input-icon"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  />
                </svg>
                <input
                  type="email"
                  id="empUsername"
                  class="auth-input"
                  placeholder="Email address"
                  aria-label="Email address"
                  required
                  autocomplete="username"
                />
              </div>
            </div>
            <div class="form-group">
              <div class="input-wrap">
                <svg
                  class="input-icon"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  />
                </svg>
                <input
                  type="password"
                  id="empPassword"
                  class="auth-input"
                  placeholder="Password"
                  required
                  autocomplete="current-password"
                />
              </div>
            </div>

            <div class="auth-error" id="empMsg" role="status"></div>

            <button type="submit" id="empBtn" class="auth-submit">
              <span id="empBtnText">Login</span>
            </button>

            <button type="button" class="auth-forgot" id="forgotCashier">
              Forgot password?
            </button>
          </form>
        </div>

        <!-- ── Admin Panel ── -->
        <div
          id="panelAdmin"
          class="panel-hidden"
          role="tabpanel"
          aria-labelledby="tabAdmin"
        >
          <form id="adminForm" autocomplete="off" novalidate>
            <div class="form-group">
              <div class="input-wrap">
                <svg
                  class="input-icon"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                  />
                </svg>
                <input
                  type="email"
                  id="adminUsername"
                  class="auth-input"
                  placeholder="Admin email address"
                  aria-label="Admin email address"
                  required
                  autocomplete="username"
                />
              </div>
            </div>
            <div class="form-group">
              <div class="input-wrap">
                <svg
                  class="input-icon"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  />
                </svg>
                <input
                  type="password"
                  id="adminPassword"
                  class="auth-input"
                  placeholder="Password"
                  required
                  autocomplete="current-password"
                />
              </div>
            </div>

            <div class="auth-error" id="adminMsg" role="status"></div>

            <button type="submit" id="adminBtn" class="auth-submit">
              <span id="adminBtnText">Login</span>
            </button>

            <button type="button" class="auth-forgot" id="forgotAdmin">
              Forgot password?
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Corner label -->
    <div class="corner-label">StockLogger v1.0</div>

    <!-- ── Reset Password Modal ── -->
    <div
      id="resetModal"
      class="reset-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="resetModalTitle"
    >
      <div class="reset-card">
        <button class="reset-close" id="closeResetModal" aria-label="Close">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>

        <div class="reset-icon">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="11" width="18" height="11" rx="0" ry="0" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>

        <h2 id="resetModalTitle" class="reset-title">Reset Password</h2>
        <p class="reset-desc">
          Enter your registered email address. We'll send you a link to reset
          your password.
        </p>

        <!-- Step 1 -->
        <div id="resetStep1">
          <input
            type="email"
            id="resetUsername"
            class="reset-input"
            placeholder="Enter your registered email"
            autocomplete="email"
          />
          <p id="resetMsg" class="reset-msg" role="status"></p>
          <div class="reset-actions">
            <button
              type="button"
              id="cancelResetModal"
              class="reset-btn-cancel"
            >
              Cancel
            </button>
            <button type="button" id="confirmReset" class="reset-btn-confirm">
              Reset
            </button>
          </div>
        </div>

        <!-- Step 2: success -->
        <div id="resetStep2" class="hidden">
          <div class="reset-success-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>
          <p class="reset-success-text">Check your email</p>
          <p id="resetSuccessInfo" class="reset-success-info">
            If an account matches that email, you'll receive a password recovery
            link.
          </p>
          <button type="button" id="closeResetSuccess" class="reset-btn-done">
            Got it
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
