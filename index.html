<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockLogger · Sign In</title>
  <meta name="description" content="Sign in to StockLogger — warehouse inventory management." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg: #f2f0ed;
      --bg-subtle: #eae7e3;
      --panel: #ffffff;
      --line: #d4d0cb;
      --text: #1a1a1a;
      --text-secondary: #4a4a4a;
      --muted: #8a8a8a;
      --out: #c43e2a;
      --mono: 'Space Mono', 'IBM Plex Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection {
      background: rgba(0,0,0,0.15);
      color: var(--text);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* 3D Background Canvas */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(242,240,237,0.92);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .loading-icon-wrap {
      width: 48px; height: 48px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      background: var(--panel);
    }
    .loading-spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--line);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    .loading-label {
      font: 400 11px var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Card container */
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }
    .auth-inner {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 40px 36px;
      position: relative;
    }

    /* Top accent line */
    .auth-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--text);
    }

    /* Logo */
    .auth-logo {
      width: 48px; height: 48px;
      background: var(--text);
      color: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .auth-title {
      font: 700 14px var(--mono);
      text-align: center;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font: 400 11px var(--mono);
      text-align: center;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* Tab switcher */
    .tab-switcher {
      display: flex;
      border: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 11px;
      font: 600 11px var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:first-child { border-right: 1px solid var(--line); }
    .tab-btn.active {
      background: var(--text);
      color: var(--panel);
    }

    /* Form inputs */
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font: 600 10px var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      width: 16px; height: 16px;
      pointer-events: none;
    }
    .auth-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 11px 12px 11px 38px;
      font: 400 13px var(--mono);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .auth-input::placeholder { color: var(--muted); }
    .auth-input:focus {
      border-color: var(--text);
      box-shadow: 0 0 0 1px var(--text);
    }

    /* Error message */
    .auth-error {
      font: 400 11px var(--mono);
      color: var(--out);
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: none;
    }
    .auth-error.visible { display: block; }

    /* Submit button */
    .auth-submit {
      width: 100%;
      padding: 13px;
      background: var(--text);
      color: var(--panel);
      border: none;
      font: 700 12px var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .auth-submit:hover { opacity: 0.85; }
    .auth-submit:active { transform: translateY(1px); }

    /* Forgot password */
    .auth-forgot {
      display: block;
      margin-top: 18px;
      text-align: center;
      font: 400 11px var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .auth-forgot:hover { color: var(--text); }

    /* Panel visibility */
    .panel-hidden { display: none; }

    /* ── Reset Modal ── */
    .reset-overlay {
      position: fixed;
      inset: 0;
      background: rgba(242,240,237,0.88);
      backdrop-filter: blur(6px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .reset-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .reset-card {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 32px;
      max-width: 380px;
      width: 100%;
      margin: 0 16px;
      position: relative;
      transform: translateY(12px);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .reset-overlay.open .reset-card {
      transform: translateY(0);
    }
    .reset-close {
      position: absolute;
      top: 14px; right: 14px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      width: 28px; height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .reset-close:hover { color: var(--text); border-color: var(--text); }

    .reset-icon {
      width: 44px; height: 44px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--text);
    }
    .reset-title {
      font: 700 13px var(--mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .reset-desc {
      font: 400 12px var(--mono);
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .reset-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 11px 12px;
      font: 400 13px var(--mono);
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .reset-input:focus { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
    .reset-input::placeholder { color: var(--muted); }

    .reset-msg {
      font: 400 11px var(--mono);
      color: var(--out);
      margin-bottom: 12px;
      display: none;
    }
    .reset-msg.error { display: block; }
    .reset-msg.visible { display: block; }

    .reset-actions {
      display: flex;
      gap: 8px;
    }
    .reset-btn-cancel {
      flex: 1;
      padding: 11px;
      background: transparent;
      border: 1px solid var(--line);
      font: 500 11px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .reset-btn-cancel:hover { border-color: var(--text); }
    .reset-btn-confirm {
      flex: 1;
      padding: 11px;
      background: var(--text);
      border: none;
      font: 600 11px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--panel);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .reset-btn-confirm:hover { opacity: 0.85; }

    /* Success step */
    .reset-success-icon {
      width: 44px; height: 44px;
      border: 1px solid rgba(45,138,78,0.3);
      background: rgba(45,138,78,0.06);
      color: #2d8a4e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .reset-success-text {
      font: 600 12px var(--mono);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .reset-success-info {
      font: 400 12px var(--mono);
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.7;
    }
    .reset-btn-done {
      width: 100%;
      padding: 11px;
      background: var(--text);
      border: none;
      font: 600 11px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--panel);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .reset-btn-done:hover { opacity: 0.85; }

    .hidden { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    /* ── Corner label ── */
    .corner-label {
      position: fixed;
      bottom: 20px;
      right: 24px;
      font: 400 10px var(--mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- 3D Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-inner">
      <div class="loading-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
          <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#1a1a1a" stroke-width="2" fill="none"/>
          <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#1a1a1a" stroke-width="1.4" opacity=".5"/>
        </svg>
      </div>
      <div class="loading-spinner"></div>
      <div class="loading-label loading-text">Authenticating...</div>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-inner">

      <!-- Logo -->
      <div class="auth-logo">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <path d="M7 20V12l7-4 7 4v8l-7 4-7-4Z" stroke="#f2f0ed" stroke-width="2" fill="none"/>
          <path d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8" stroke="#f2f0ed" stroke-width="1.4" opacity=".6"/>
        </svg>
      </div>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">StockLogger Authentication</p>

      <!-- Tab switcher -->
      <div class="tab-switcher" role="tablist">
        <button id="tabCashier" class="tab-btn active" role="tab" aria-selected="true" aria-controls="panelCashier">Cashier</button>
        <button id="tabAdmin" class="tab-btn" role="tab" aria-selected="false" aria-controls="panelAdmin">Admin</button>
      </div>

      <!-- ── Cashier Panel ── -->
      <div id="panelCashier" role="tabpanel" aria-labelledby="tabCashier">
        <form id="employeeForm" autocomplete="off" novalidate>
          <div class="form-group">
            <div class="input-wrap">
              <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              <input type="text" id="empUsername" class="auth-input" placeholder="Username" required autocomplete="username" />
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrap">
              <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              <input type="password" id="empPassword" class="auth-input" placeholder="Password" required autocomplete="current-password" />
            </div>
          </div>

          <div class="auth-error" id="empMsg" role="status"></div>

          <button type="submit" id="empBtn" class="auth-submit">
            <span id="empBtnText">Login</span>
          </button>
          
          <button type="button" class="auth-forgot" id="forgotCashier">Forgot password?</button>
        </form>
      </div>

      <!-- ── Admin Panel ── -->
      <div id="panelAdmin" class="panel-hidden" role="tabpanel" aria-labelledby="tabAdmin">
        <form id="adminForm" autocomplete="off" novalidate>
          <div class="form-group">
            <div class="input-wrap">
              <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              <input type="text" id="adminUsername" class="auth-input" placeholder="Admin Username" required autocomplete="username" />
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrap">
              <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              <input type="password" id="adminPassword" class="auth-input" placeholder="Password" required autocomplete="current-password" />
            </div>
          </div>

          <div class="auth-error" id="adminMsg" role="status"></div>

          <button type="submit" id="adminBtn" class="auth-submit">
            <span id="adminBtnText">Login</span>
          </button>
          
          <button type="button" class="auth-forgot" id="forgotAdmin">Forgot password?</button>
        </form>
      </div>

    </div>
  </div>

  <!-- Corner label -->
  <div class="corner-label">StockLogger v1.0</div>

  <!-- ── Reset Password Modal ── -->
  <div id="resetModal" class="reset-overlay" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <div class="reset-card">
      <button class="reset-close" id="closeResetModal" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      
      <div class="reset-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="0" ry="0"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      
      <h2 id="resetModalTitle" class="reset-title">Reset Password</h2>
      <p class="reset-desc">Your password will be reset to the <strong>default</strong>. Enter your username to confirm.</p>

      <!-- Step 1 -->
      <div id="resetStep1">
        <input type="text" id="resetUsername" class="reset-input" placeholder="Enter your username" autocomplete="off" />
        <p id="resetMsg" class="reset-msg" role="status"></p>
        <div class="reset-actions">
          <button type="button" id="cancelResetModal" class="reset-btn-cancel">Cancel</button>
          <button type="button" id="confirmReset" class="reset-btn-confirm">Reset</button>
        </div>
      </div>

      <!-- Step 2: success -->
      <div id="resetStep2" class="hidden">
        <div class="reset-success-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="reset-success-text">Password reset successfully!</p>
        <p id="resetSuccessInfo" class="reset-success-info"></p>
        <button type="button" id="closeResetSuccess" class="reset-btn-done">Got it</button>
      </div>
    </div>
  </div>

  <script>
    /* ── Tab switching ── */
    const tabs = {
      cashier: { btn: document.getElementById('tabCashier'), panel: document.getElementById('panelCashier') },
      admin:   { btn: document.getElementById('tabAdmin'),   panel: document.getElementById('panelAdmin') },
    };

    function switchTab(active) {
      Object.entries(tabs).forEach(([key, { btn, panel }]) => {
        const isActive = key === active;
        if (isActive) {
          btn.classList.add('active');
          panel.classList.remove('panel-hidden');
        } else {
          btn.classList.remove('active');
          panel.classList.add('panel-hidden');
        }
        btn.setAttribute('aria-selected', String(isActive));
      });
    }

    tabs.cashier.btn.addEventListener('click', () => switchTab('cashier'));
    tabs.admin.btn.addEventListener('click',   () => switchTab('admin'));

    // Observe modal open class
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.attributeName === 'class') {
          const resetOverlay = document.getElementById('resetModal');
          // Already handled by CSS .open class
        }
      });
    });
    observer.observe(document.getElementById('resetModal'), { attributes: true });

    // Patch error messages to toggle visibility
    const patchMsg = (id) => {
      const el = document.getElementById(id);
      if(!el) return;
      const obs = new MutationObserver(() => {
        if(el.textContent.trim() !== '') {
          el.classList.add('visible');
        } else {
          el.classList.remove('visible');
        }
      });
      obs.observe(el, { childList: true, characterData: true, subtree: true });
    };
    patchMsg('empMsg');
    patchMsg('adminMsg');
    patchMsg('resetMsg');
  </script>

  <script type="module" src="/src/login.ts"></script>
</body>
</html>
