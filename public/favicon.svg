<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="topFace" x1="8" y1="7" x2="24" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#333338"/>
      <stop offset="100%" stop-color="#1f1f23"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="7" y1="11" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17171a"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="16" y1="16" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#212126"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <!-- #999999 background squircle with subtle border -->
  <rect width="32" height="32" rx="7" fill="#999999"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#777777" stroke-opacity="0.8"/>

  <!-- Isometric Warehouse Box -->
  <!-- Top Face -->
  <path d="M16 6.5L24.5 11.2L16 16L7.5 11.2L16 6.5Z" fill="url(#topFace)"/>

  <!-- Left Face -->
  <path d="M7.5 11.2L16 16V25.5L7.5 20.7V11.2Z" fill="url(#leftFace)"/>

  <!-- Right Face -->
  <path d="M24.5 11.2L16 16V25.5L24.5 20.7V11.2Z" fill="url(#rightFace)"/>

  <!-- Outer Isometric Contour -->
  <path d="M16 6.5L24.5 11.2V20.7L16 25.5L7.5 20.7V11.2L16 6.5Z" stroke="#000000" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Inner Seams & Highlights -->
  <path d="M16 16V25.5" stroke="#000000" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M16 16L7.5 11.2" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.45"/>
  <path d="M16 16L24.5 11.2" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Stylized Inventory Arrow on top face -->
  <path d="M13.5 12L16 10.5L18.5 12" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 10.5V13.8" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
