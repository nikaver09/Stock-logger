<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StockLogger · Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f2f0ed;
        --panel: #ffffff;
        --line: #d4d0cb;
        --text: #1a1a1a;
        --muted: #8a8a8a;
        --out: #c43e2a;
        --mono: 'Space Mono', monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 40px 36px;
        position: relative;
      }

      .auth-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--text);
      }

      .auth-logo {
        width: 48px;
        height: 48px;
        background: var(--text);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }

      h1 {
        font-size: 14px;
        text-align: center;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 11px;
        text-align: center;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 28px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 7px;
      }

      input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 12px;
        font: 400 13px var(--mono);
        outline: none;
      }

      input:focus {
        border-color: var(--text);
        box-shadow: 0 0 0 1px var(--text);
      }

      .submit-btn {
        width: 100%;
        padding: 13px;
        background: var(--text);
        color: white;
        border: none;
        font: 700 12px var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        margin-top: 12px;
      }

      .submit-btn:hover {
        opacity: 0.85;
      }

      .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .message {
        display: none;
        font-size: 11px;
        line-height: 1.7;
        margin-top: 14px;
      }

      .message.error {
        display: block;
        color: var(--out);
      }

      .message.success {
        display: block;
        color: #2d8a4e;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        font-size: 11px;
        color: var(--muted);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .back-link:hover {
        color: var(--text);
      }

      .hidden {
        display: none !important;
      }

      .corner-label {
        position: fixed;
        bottom: 20px;
        right: 24px;
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
    </style>
  </head>

  <body>
    <main class="auth-card">
      <div class="auth-logo">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <path
            d="M7 20V12l7-4 7 4v8l-7 4-7-4Z"
            stroke="#f2f0ed"
            stroke-width="2"
            fill="none"
          />
          <path
            d="M14 8l-7 4m7-4 7 4m-7-4v4m0 0-7 4m7-4 7 4m-7-4v8"
            stroke="#f2f0ed"
            stroke-width="1.4"
            opacity=".6"
          />
        </svg>
      </div>

      <h1>Reset Password</h1>
      <p class="subtitle">StockLogger Account Recovery</p>

      <form id="resetPasswordForm" class="hidden">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>

        <p id="resetMessage" class="message" role="status"></p>

        <button type="submit" id="updatePasswordBtn" class="submit-btn">
          Update Password
        </button>
      </form>

      <div id="successPanel" class="hidden">
        <p class="message success">
          Your password has been successfully updated.
        </p>

        <a href="/" class="back-link">Return to Login</a>
      </div>

      <div id="invalidPanel" class="hidden">
        <p class="message error">
          Your recovery session is invalid or expired. Please request a new
          password recovery email.
        </p>

        <a href="/" class="back-link">Return to Login</a>
      </div>
    </main>

    <div class="corner-label">StockLogger v1.0</div>

    <script type="module" src="/src/reset-password.ts"></script>
  </body>
</html>
